<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>МедКарта — техническая документация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Техническая документация МедКарты: архитектура, ИИ-ассистент, приватность, маршрутизация, API, развёртывание">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    .markdown-section { max-width: 980px; }
    .markdown-section table { display: block; overflow-x: auto; }
    .markdown-section .mermaid { margin: 1.5em 0; text-align: center; overflow-x: auto; }
  </style>
</head>
<body>
  <div id="app">Загрузка документации…</div>
  <noscript>
    Сайт документации работает на JavaScript (docsify). Без него читайте
    файлы <code>docs/*.md</code> прямо в репозитории на GitHub.
  </noscript>
  <script src="assets/site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.14.0/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
  </script>
</body>
</html>
