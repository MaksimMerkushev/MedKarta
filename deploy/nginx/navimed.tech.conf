# МедКарта — конфигурация сайта nginx (шаблон). Проверьте пути под свой сервер.
#
# Что делает:
#   - HTTP → HTTPS, HSTS и остальные заголовки безопасности на страницах и
#     статике (их ставит nginx; на ответах /api/* их ставит сам Node);
#   - отдаёт собранный фронтенд (dist/) и SPA-маршруты через index.html;
#   - проксирует /api/* в Node на 127.0.0.1:3001;
#   - принимает только свои имена сайта, внешний предел частоты на ассистента и вход.
#
# Установка (на сервере, после резервной копии текущего конфига):
#   sudo cp deploy/nginx/security-headers*.conf deploy/nginx/medkarta-proxy.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/medkarta-http.conf /etc/nginx/conf.d/
# Если certbot добавил в текущий конфиг свои строки (options-ssl-nginx.conf,
# ssl_dhparam), перенесите их в блоки server с ssl.
#   sudo cp deploy/nginx/navimed.tech.conf /etc/nginx/sites-available/navimed.tech
#   sudo nginx -t        # только проверка синтаксиса, ничего не применяет
#   sudo systemctl reload nginx
# Проверка после применения: node scripts/check-headers.mjs https://navimed.tech

# Чужие имена (запрос по IP или на чужой домен) — закрыть соединение.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name navimed.tech www.navimed.tech;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://navimed.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.navimed.tech;
    ssl_certificate     /etc/letsencrypt/live/navimed.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navimed.tech/privkey.pem;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://navimed.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name navimed.tech;

    ssl_certificate     /etc/letsencrypt/live/navimed.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navimed.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:medkarta_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    root /var/www/medkarta/dist;
    index index.html;

    # Тело запроса: API принимает до 32 КБ, аватар — до 256 КБ (в base64 больше),
    # окончательный предел проверяет Node.
    client_max_body_size 512k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Скрытые файлы и служебное — никогда.
    location ~ /\.(?!well-known/) { return 404; }

    # Собранные файлы с хешем в имени: кэш на год.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Страницы со ссылкой-ключом в адресе: Referer не уходит никуда.
    location ~ ^/(activate|register/confirm|email/confirm)/?$ {
        include /etc/nginx/snippets/security-headers-token-pages.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # Ассистент и вход: внешний предел частоты (лимиты в Node остаются основными).
    location = /api/chat {
        limit_req zone=medkarta_chat burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/medkarta-proxy.conf;
    }
    location ^~ /api/auth/ {
        limit_req zone=medkarta_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/medkarta-proxy.conf;
    }

    # Остальное API — в Node; заголовки безопасности ставит он.
    location ^~ /api/ {
        include /etc/nginx/snippets/medkarta-proxy.conf;
    }

    # SPA: страницы, которых нет на диске, отдаёт index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
