<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=2" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!--
      user-scalable=no и maximum-scale=1 убраны: они запрещали пользователю
      увеличивать текст на телефоне (нарушение WCAG 1.4.4) и в iOS Safari
      всё равно игнорируются.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="МедКарта" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="МедКарта — поиск врачей и клиник в Казани с AI-навигатором и построением маршрутов" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="МедКарта" />
    <meta property="og:title" content="МедКарта — врачи и клиники Казани" />
    <meta property="og:description" content="Поиск врачей и клиник в Казани: фильтры, расписание, маршруты и AI-навигатор." />
    <meta name="twitter:card" content="summary" />

    <!-- Тайлы и роутинг тянутся сразу после загрузки карты — сокращаем задержку. -->
    <link rel="preconnect" href="https://a.tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://routing.openstreetmap.de" />

    <title>МедКарта — врачи и клиники Казани</title>
  </head>

    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui, sans-serif; line-height: 1.6">

      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
