#
# Проверки на каждый PR и каждый коммит в main. Секретов здесь нет: ключи модели
# пустые, поэтому платных вызовов из CI не бывает. Выкладку на сервер CI не делает.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENROUTER_API_KEY: ''
  AI_API_KEY: ''
  AI_UPSTREAM_URL: ''
  AI_PROXY_URL: ''

jobs:
  checks:
    name: Tests, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:hybrid
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AI_SYMPTOM_TRIAGE: 'off'
      # Playwright не входит в зависимости проекта, поэтому версия закреплена здесь.
      PLAYWRIGHT_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
