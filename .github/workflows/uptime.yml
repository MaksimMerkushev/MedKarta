name: Uptime

# Внешняя проверка сайта. GitHub запускает расписание с задержками (на деле —
# раз в несколько часов), поэтому это запасная проверка: основную ставьте во
# внешнем сервисе мониторинга с оповещениями (internal-docs/15-server-deployment.md).
# Падение задачи — письмо владельцу репозитория от GitHub.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Frontend
        run: |
          body=$(curl -sS --retry 3 --retry-all-errors --retry-delay 20 --max-time 20 https://navimed.tech/)
          echo "$body" | grep -q '/assets/' || { echo "Главная не ссылается на собранный фронтенд"; exit 1; }
          asset=$(echo "$body" | grep -oE '/assets/[A-Za-z0-9._-]+\.js' | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://navimed.tech$asset")
          echo "frontend: главная и $asset → HTTP $code"
          test "$code" = "200"
      - name: API
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --retry-delay 20 --max-time 20 https://navimed.tech/api/health)
          echo "/api/health → HTTP $code"
          test "$code" = "200"
          curl -sS --max-time 20 https://navimed.tech/api/config | grep -q '"demo"' || { echo "/api/config не отвечает JSON"; exit 1; }
      - name: Readiness (database, model, backups)
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          if [ -z "$MONITOR_TOKEN" ]; then echo "Секрет MONITOR_TOKEN не задан — проверка готовности пропущена"; exit 0; fi
          out=$(curl -s -w '\n%{http_code}' --max-time 20 -H "Authorization: Bearer $MONITOR_TOKEN" https://navimed.tech/api/health/ready)
          code=$(echo "$out" | tail -1)
          echo "/api/health/ready → HTTP $code: $(echo "$out" | head -1)"
          test "$code" = "200"
